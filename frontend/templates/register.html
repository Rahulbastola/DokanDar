{% extends "base.html" %}
{% load static %}
{% block title %}Register - DokanDar{% endblock %}
{% block content %}
<div class="card" style="max-width:460px; margin: 40px auto;">
  <h2>Create an account</h2>
  <form class="stacked" id="register-form">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>First name</label>
    <input type="text" name="first_name">
    <label>Last name</label>
    <input type="text" name="last_name">
    <label>Phone</label>
    <input type="text" name="phone">
    <label>Password</label>
    <input type="password" name="password" required>
    <label>Account type</label>
    <select name="role">
      <option value="user">Customer - browse & buy products</option>
      <option value="admin">Vendor - sell products (requires super admin approval)</option>
    </select>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted" style="margin-top:12px;">Already have an account? <a href="login.html">Login</a></p>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
